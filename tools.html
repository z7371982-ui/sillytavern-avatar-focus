<div id="stafe_tools" class="stafe-editor" hidden aria-hidden="true">
  <div class="stafe-backdrop" data-stafe-tools="close"></div>
  <section class="stafe-dialog" role="dialog" aria-modal="true" aria-labelledby="stafe_tools_title">
    <header class="stafe-dialog-header">
      <div><h2 id="stafe_tools_title">头像工具</h2><p>选择当前聊天中的头像</p></div>
      <button class="stafe-icon-button" data-stafe-tools="close" type="button" aria-label="关闭">×</button>
    </header>
    <div class="stafe-dialog-content">
      <div class="stafe-controls">
        <label for="stafe_tools_target">要操作的头像</label>
        <select id="stafe_tools_target" class="text_pole"></select>
        <button class="menu_button" data-stafe-tools="adjust" type="button">调整头像</button>
        <button class="menu_button" data-stafe-tools="gallery" type="button">头像库</button>
        <small>头像被装饰挡住也可以从这里打开。关闭长按或三击开关后，这个入口仍然可用。</small>
      </div>
    </div>
  </section>
</div>
